services:
  postgres:
    image: postgres:16-alpine
    container_name: quizora-postgres
    environment:
      POSTGRES_DB: quizora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - quizora-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  quizora-pgdata:
