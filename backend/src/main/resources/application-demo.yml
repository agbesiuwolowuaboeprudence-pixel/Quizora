# Zero-setup local run: ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
# Uses an in-memory H2 database (PostgreSQL compatibility mode) and re-seeds on every start.
spring:
  datasource:
    url: jdbc:h2:mem:quizora;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false   # demo profile relies on Hibernate ddl-auto create-drop for in-memory H2
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

quizora:
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  seed:
    enabled: true
