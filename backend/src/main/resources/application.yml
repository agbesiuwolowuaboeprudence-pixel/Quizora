spring:
  application:
    name: quizora-backend

  # PostgreSQL (default profile). For a zero-setup local run use: --spring.profiles.active=demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/quizora}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none   # schema is managed by Flyway migrations
    open-in-view: false
    properties:
      hibernate:
        # Explicit dialect: without it Hibernate needs a live JDBC connection to detect the
        # database, and a missing/unreachable PostgreSQL surfaces as the misleading
        # "Unable to determine Dialect without JDBC metadata" error.
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-missing: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB

server:
  port: 8080
  error:
    include-message: never

quizora:
  security:
    jwt:
      # Must be supplied from a secret manager or environment; never commit a signing key.
      secret: ${JWT_SECRET:}
      expiration-ms: 86400000   # 24 hours
  cors:
    allowed-origins: ${CORS_ORIGINS}
  seed:
    enabled: false              # demo accounts must only be created in the demo profile
  subscription:
    trial-days: 7               # free trial granted to individual sign-ups
